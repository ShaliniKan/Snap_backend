name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy/Frontend deploy/Backend
          cp -r Frontend/build deploy/Frontend/build
          rsync -a Backend/ deploy/Backend/ \
            --exclude node_modules \
            --exclude .env \
            --exclude uploads \
            --exclude tests \
            --exclude "*.log"

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "/var/www/apnamart"
          strip_components: 1
          overwrite: true

      - name: Install backend deps and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/apnamart/Backend
            npm ci --omit=dev
            pm2 restart apnamart-api || pm2 start server.js --name apnamart-api
            pm2 save
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Deploy completed successfully."
